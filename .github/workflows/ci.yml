name: CI

on:
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile
      - name: Audit mobile dependencies
        run: npm audit --prefix apps/mobile --audit-level=high
      - name: Check mobile types and lint
        run: npm --prefix apps/mobile run typecheck && npm --prefix apps/mobile run lint
      - name: Bundle Android and iOS
        working-directory: apps/mobile
        run: npm run export -- --max-workers 2

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (block high/critical)
        run: npm audit --audit-level=high

      - name: Audit dependencies (warn moderate)
        run: npm audit --audit-level=moderate || echo "::warning::Moderate vulnerabilities found — review with npm audit"

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test
